# Pebble theme, in light and dark. Streamlit picks the pair member that matches
# the device setting, or the choice made under Appearance in the profile menu.
# Card shapes, motion and the Onest font are applied by ais_fmd/ui/theme.py
# (app_css) -- these options only cover what Streamlit's theme exposes, and
# the colours here mirror theme.LIGHT / theme.DARK so widgets and cards agree.

[theme]
showWidgetBorder = false
baseRadius = "full"
font = "sans serif"

[theme.light]
primaryColor = "#D6400E"
backgroundColor = "#F5F5F3"
secondaryBackgroundColor = "#F3F3F0"
textColor = "#111111"
linkColor = "#D6400E"
borderColor = "#ECECE9"

[theme.dark]
primaryColor = "#F0552A"
backgroundColor = "#161615"
secondaryBackgroundColor = "#2A2A28"
textColor = "#F2F2EF"
linkColor = "#FF9A74"
borderColor = "#333331"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
# No Deploy button or ⋮ menu: the profile menu (top right) takes that corner,
# and an operator has no use for Streamlit's developer options.
toolbarMode = "minimal"
